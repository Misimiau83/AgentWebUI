services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /data
      WORKSPACE_DIR: /work
      FILES_ROOTS: /work
      TRUST_PROXY: "true"
    volumes:
      - data:/data
      - work:/work
      - home:/home/agentwebui

volumes:
  data:
  work:
  home:
